apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-inference-gateway
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/rockymartinezproject/ai-inference-gateway.git
    targetRevision: main
    path: deployments/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
