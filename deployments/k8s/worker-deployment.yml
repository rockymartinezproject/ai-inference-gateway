apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-worker
  namespace: ai-gateway
  labels:
    app: gateway-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-worker
  template:
    metadata:
      labels:
        app: gateway-worker
    spec:
      containers:
        - name: worker
          image: ai-inference-gateway:latest
          command: ["python", "-m", "app.workers.processor"]
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
