apiVersion: v1
kind: Service
metadata:
  name: ai-inference-gateway
  namespace: ai-gateway
  labels:
    app: ai-inference-gateway
spec:
  type: ClusterIP
  selector:
    app: ai-inference-gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
