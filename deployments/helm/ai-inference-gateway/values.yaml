replicaCount: 2

image:
  repository: ghcr.io/rockymartinezproject/ai-inference-gateway
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: gateway.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

env:
  LOG_LEVEL: info
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/gateway

secrets:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
