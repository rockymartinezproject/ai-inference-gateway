version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    # Security updates only; version bumps are handled manually so CI noise stays low.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "github-actions"
