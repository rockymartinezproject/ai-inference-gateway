name: Real Provider Integration Tests

on:
  workflow_dispatch:
    inputs:
      openai:
        description: "Run OpenAI tests"
        required: false
        default: true
        type: boolean
      anthropic:
        description: "Run Anthropic tests"
        required: false
        default: true
        type: boolean
      ollama:
        description: "Run Ollama tests"
        required: false
        default: false
        type: boolean
      ollama_url:
        description: "Ollama base URL (if enabled)"
        required: false
        default: "http://localhost:11434"
        type: string

jobs:
  real-provider-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run real provider tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OLLAMA_BASE_URL: ${{ github.event.inputs.ollama_url }}
        run: pytest tests/integration/test_real_providers.py -v
